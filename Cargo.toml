[package]
name = "loudtrace"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "A standalone loudness analyzer with Spotify Normal reference predictions"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "x11", "wayland"] }
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "fontconfig"] }
skrifa = "0.44.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
tempfile = "3"
ebur128 = "0.1.10"
symphonia = { version = "0.5.5", features = ["all"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
rubato = "0.16.2"

[dev-dependencies]
hound = "3.5"

[profile.release]
lto = "thin"
strip = true

